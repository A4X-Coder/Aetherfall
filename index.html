<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AETHERFALL — Celestial Match-3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app-container">
    <canvas id="bg-canvas"></canvas>

    <!-- TITLE SCREEN -->
    <div id="screen-title" class="screen active">
      <div class="title-logo-container">
        <h1 class="title-logo">AETHERFALL</h1>
        <p class="title-sub">Harmonize the Celestial Crystals</p>
      </div>
      <button id="btn-play-title" class="btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Commence
      </button>
    </div>

    <!-- LEVEL SELECTION SCREEN -->
    <div id="screen-levels" class="screen">
      <div class="level-select-container">
        <div class="level-select-header">
          <button id="btn-back-levels" class="btn btn-secondary btn-icon" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <h2>Cosmic Spheres</h2>
          <div style="width: 44px;"></div>
        </div>
        <div id="level-grid" class="level-grid"></div>
      </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="screen-game" class="screen">
      <!-- HUD -->
      <header class="hud-top">
        <div class="hud-stat">
          <span class="hud-stat-label">Moves</span>
          <span id="hud-moves" class="hud-stat-val">25</span>
        </div>

        <div class="hud-progress-wrap">
          <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted);">
            <span id="hud-objective-text">Objective</span>
            <span>★</span>
          </div>
          <div class="progress-bar-bg">
            <div id="hud-star-fill" class="progress-bar-fill"></div>
            <div class="star-indicators">
              <div class="star-indicator" style="left: 33%;"></div>
              <div class="star-indicator" style="left: 66%;"></div>
              <div class="star-indicator" style="left: 100%;"></div>
            </div>
          </div>
        </div>

        <div class="hud-stat">
          <span class="hud-stat-label">Score</span>
          <span id="hud-score" class="hud-stat-val">0</span>
        </div>

        <button id="btn-pause" class="btn btn-secondary btn-icon" style="margin-left: 8px;" aria-label="Pause">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
      </header>

      <!-- Board Area -->
      <main class="board-container">
        <canvas id="board-canvas"></canvas>
      </main>

      <div style="height: 12px;"></div>
    </div>

    <!-- PAUSE & SETTINGS MODAL -->
    <div id="modal-pause" class="modal-overlay">
      <div class="modal-card">
        <h3 class="modal-title">Harmonics Suspended</h3>
        <div class="settings-row">
          <span>Master</span>
          <input type="range" id="slider-master" class="settings-slider" min="0" max="1" step="0.05">
        </div>
        <div class="settings-row">
          <span>ASMR Chimes</span>
          <input type="range" id="slider-sfx" class="settings-slider" min="0" max="1" step="0.05">
        </div>
        <div class="settings-row">
          <span>Atmosphere</span>
          <input type="range" id="slider-music" class="settings-slider" min="0" max="1" step="0.05">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <button id="btn-resume" class="btn" style="flex: 1;">Resume</button>
          <button id="btn-restart" class="btn btn-secondary btn-icon" title="Restart">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          </button>
        </div>
        <button id="btn-quit" class="btn btn-secondary" style="width: 100%;">Spheres Map</button>
      </div>
    </div>

    <!-- LEVEL VICTORY MODAL -->
    <div id="modal-victory" class="modal-overlay">
      <div class="modal-card">
        <h3 id="modal-victory-title" class="modal-title">Sphere Harmonized</h3>
        <div id="modal-victory-stars" class="modal-stars">★★★</div>
        <div class="modal-score-box">
          <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">Final Resonance</span>
          <span id="modal-victory-score" style="font-size: 1.6rem; font-weight: 700; color: #fff;">0</span>
        </div>
        <button id="btn-next-level" class="btn" style="width: 100%;">Continue Ascendance</button>
      </div>
    </div>

    <!-- LEVEL FAILURE MODAL -->
    <div id="modal-failure" class="modal-overlay">
      <div class="modal-card">
        <h3 id="modal-fail-title" class="modal-title">Resonance Lost</h3>
        <p style="font-size: 0.9rem; color: var(--text-muted);">The cosmic field lost stability before completion.</p>
        <div class="modal-score-box">
          <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted);">Score Attained</span>
          <span id="modal-fail-score" style="font-size: 1.4rem; font-weight: 700; color: #fff;">0</span>
        </div>
        <div style="display: flex; gap: 10px;">
          <button id="btn-retry-fail" class="btn" style="flex: 1;">Re-harmonize</button>
          <button id="btn-levels-fail" class="btn btn-secondary" style="flex: 1;">Spheres</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/audio.js"></script>
  <script src="./js/levels.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/renderer.js"></script>
  <script src="./js/game.js"></script>
</body>
</html>
